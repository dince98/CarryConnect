<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorant Rank Boost Prices | CarryConnect</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; }
        
        .navbar {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%) !important;
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .navbar-brand { font-size: 28px !important; font-weight: 800 !important; color: white !important; letter-spacing: -0.5px; }
        .navbar-brand span { color: #3b82f6; }
        .nav-link { color: rgba(255,255,255,0.9) !important; font-weight: 600; margin: 0 5px; padding: 8px 16px !important; border-radius: 8px; }
        .nav-link:hover { background: rgba(59, 130, 246, 0.2); color: white !important; }
        .nav-link.active { background: #3b82f6 !important; color: white !important; }
        .dropdown-menu { background: #1e293b; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 8px; margin-top: 8px; }
        .dropdown-item { color: rgba(255,255,255,0.9); font-weight: 600; padding: 10px 20px; border-radius: 8px; transition: all 0.3s; }
        .dropdown-item:hover { background: #3b82f6; color: white; }
        .dropdown-item i { width: 20px; margin-right: 10px; color: #3b82f6; }
        .btn-account { border: 2px solid rgba(255,255,255,0.2); color: white !important; display: flex; align-items: center; gap: 8px; }
        .btn-account:hover { background: rgba(59, 130, 246, 0.2); }
        
        .valorant-hero {
            background: linear-gradient(135deg, #0f1923 0%, #1f2c39 100%);
            color: white; padding: 60px 0;
            position: relative; overflow: hidden;
            border-bottom: 5px solid #ff4655;
        }
        .valorant-title {
            font-size: 48px; font-weight: 800; color: #ff4655;
            text-shadow: 0 0 10px rgba(255, 70, 85, 0.3);
        }
        .back-button-container { position: absolute; top: 20px; left: 20px; z-index: 100; }
        .btn-back {
            padding: 10px 25px; border-radius: 50px; font-weight: 600;
            transition: all 0.3s; display: inline-flex; align-items: center;
            gap: 10px; text-decoration: none; border: 2px solid;
            backdrop-filter: blur(5px);
            background: linear-gradient(135deg, #0f1923, #1f2c39);
            color: white; border-color: #ff4655;
        }
        .btn-back:hover { background: rgba(255, 70, 85, 0.2); color: white; }
        
        .pricing-section {
            position: relative;
            isolation: isolate;
            padding: 60px 0;
        }
        .pricing-section::before {
            content: ""; position: absolute; inset: 0;
            background: 
                linear-gradient(135deg, rgba(10, 5, 20, 0.9) 0%, rgba(25, 10, 35, 0.95) 100%),
                url('clove.png') center center / cover no-repeat fixed;
            opacity: 0.98;
            z-index: -2;
        }
        .pricing-section::after {
            content: ""; position: absolute; inset: 0;
            background: 
                radial-gradient(circle at 20% 30%, rgba(255, 70, 85, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(180, 70, 255, 0.25) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }
        
        .section-header { text-align: center; margin-bottom: 50px; }
        .section-header h2 {
            font-size: 36px; font-weight: 700; color: white;
            position: relative; display: inline-block;
            text-shadow: 0 0 20px rgba(255, 70, 85, 0.5), 0 2px 10px rgba(0,0,0,0.5);
        }
        .section-header h2:after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); width: 100px; height: 5px;
            background: #ff4655; border-radius: 2px;
            box-shadow: 0 0 15px #ff4655;
        }
        
        .rank-card {
            background: rgba(18, 22, 35, 0.75);
            backdrop-filter: blur(10px);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            height: 100%;
            border: 1px solid rgba(255, 70, 85, 0.3);
            position: relative;
            display: flex; flex-direction: column;
        }
        .rank-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(255, 70, 85, 0.3);
            border-color: #ff4655;
        }
        .rank-images-container {
            width: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.4); padding: 25px 20px;
            gap: 15px; border-bottom: 1px solid rgba(255, 70, 85, 0.2);
        }
        .rank-image-wrapper { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .rank-image-wrapper img {
            width: 100px; height: 100px; object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 70, 85, 0.5));
            transition: transform 0.3s;
        }
        .rank-card:hover .rank-image-wrapper img {
            transform: scale(1.1);
            filter: drop-shadow(0 0 20px #ff4655);
        }
        .rank-label {
            color: white; font-size: 12px; font-weight: 600;
            margin-top: 8px; text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(255, 70, 85, 0.2);
            padding: 4px 12px; border-radius: 50px;
            border: 1px solid rgba(255, 70, 85, 0.3);
        }
        .arrow-icon {
            color: #ff4655; font-size: 28px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px #ff4655;
        }
        .rank-body {
            padding: 20px; text-align: center; flex: 1;
            display: flex; flex-direction: column;
            background: rgba(0, 0, 0, 0.2);
        }
        .rank-name {
            font-size: 22px; font-weight: 700; margin-bottom: 8px;
            color: white; text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        .rank-tier {
            display: inline-block; padding: 4px 15px;
            background: rgba(255, 70, 85, 0.15);
            border-radius: 50px; font-size: 11px;
            font-weight: 600; color: #ff9faf; margin-bottom: 15px;
            align-self: center;
            border: 1px solid rgba(255, 70, 85, 0.3);
        }
        .price-tag {
            text-align: center; margin-bottom: 20px;
            padding: 12px 0;
            border-top: 1px dashed rgba(255, 70, 85, 0.3);
            border-bottom: 1px dashed rgba(255, 70, 85, 0.3);
        }
        .price-amount {
            font-size: 32px; font-weight: 800; color: white;
            text-shadow: 0 0 15px #ff4655;
        }
        .peso-sign { color: #ff4655; font-size: 20px; margin-right: 2px; font-weight: 700; }
        .btn-order {
            background: linear-gradient(135deg, #ff4655, #d63a47);
            color: white; font-weight: 700; padding: 12px 20px;
            border-radius: 50px; border: none; width: 100%;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; font-size: 15px; margin-top: auto;
            text-transform: uppercase; letter-spacing: 0.5px;
            box-shadow: 0 5px 15px rgba(255, 70, 85, 0.4);
        }
        .btn-order:hover {
            background: linear-gradient(135deg, #ff5f6d, #e64a57);
            transform: scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 70, 85, 0.6);
        }
        .popular-badge {
            position: absolute; top: 10px; right: 10px;
            background: linear-gradient(135deg, #ff4655, #d63a47);
            color: white; padding: 5px 15px;
            border-radius: 50px; font-size: 11px; font-weight: 700;
            z-index: 10; box-shadow: 0 5px 15px rgba(255,70,85,0.5);
            text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        /* ===== TOP BOOSTERS WIDGET (Valorant theme) ===== */
        .top-boosters-wrapper {
            max-width: 1100px; margin: 40px auto 50px;
            padding: 30px 25px;
            background: rgba(18, 22, 35, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            border: 2px solid rgba(255, 70, 85, 0.3);
            box-shadow: 0 20px 60px rgba(255, 70, 85, 0.2);
            position: relative; overflow: hidden;
        }
        .top-boosters-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
            background: linear-gradient(90deg, #ff4655, #d63a47, #ff7f8a);
        }
        .top-boosters-header { text-align: center; margin-bottom: 25px; }
        .top-boosters-title {
            display: inline-flex; align-items: center; gap: 12px;
            font-size: 22px; font-weight: 800; color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
            margin-bottom: 8px;
        }
        .top-boosters-title i { font-size: 26px; filter: drop-shadow(0 0 12px #fbbf24); }
        .top-boosters-subtitle {
            font-size: 14px; color: rgba(255, 255, 255, 0.65); font-weight: 500;
        }
        .top-boosters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px; margin-bottom: 20px;
        }
        .top-booster-card {
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px; padding: 22px 18px;
            text-align: center; position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .top-booster-card:hover:not(.busy) {
            transform: translateY(-5px);
            border-color: rgba(255, 70, 85, 0.6);
            box-shadow: 0 20px 40px rgba(255, 70, 85, 0.3);
            background: rgba(255, 70, 85, 0.08);
        }
        .top-booster-card.busy { opacity: 0.55; filter: grayscale(0.4); cursor: not-allowed; }
        .top-booster-card.picked {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
        }
        .medal-badge {
            position: absolute; top: -10px; right: -10px;
            font-size: 32px;
            filter: drop-shadow(0 4px 12px rgba(251, 191, 36, 0.6));
            animation: medalFloat 3s ease-in-out infinite;
        }
        @keyframes medalFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(5deg); }
        }
        .top-booster-avatar {
            width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, #ff4655, #d63a47);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 800; color: white;
            margin: 0 auto 12px;
            border: 3px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 20px rgba(255, 70, 85, 0.4);
        }
        .top-booster-name {
            font-size: 17px; font-weight: 800; color: white;
            margin-bottom: 8px; word-break: break-word;
        }
        .top-booster-rating {
            font-size: 14px; font-weight: 700; color: #fbbf24;
            margin-bottom: 12px; display: flex;
            align-items: center; justify-content: center; gap: 4px;
        }
        .mini-star { font-size: 16px; filter: drop-shadow(0 0 6px #fbbf24); }
        .mini-count { font-size: 12px; color: rgba(255, 255, 255, 0.5); font-weight: 600; }
        .mini-new { font-size: 12px; color: rgba(255, 255, 255, 0.4); font-style: italic; font-weight: 500; }
        .top-booster-status {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; padding: 5px 12px;
            border-radius: 50px; margin-bottom: 14px;
            text-transform: uppercase; letter-spacing: 0.4px;
        }
        .status-available {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4);
        }
        .status-busy {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4);
        }
        .status-available i { font-size: 8px; animation: pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .btn-request-booster {
            width: 100%; padding: 11px 14px; border-radius: 50px;
            border: none; background: linear-gradient(135deg, #10b981, #059669);
            color: white; font-weight: 700; font-size: 13px;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; text-transform: uppercase; letter-spacing: 0.4px;
        }
        .btn-request-booster:hover:not(.disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(16, 185, 129, 0.5);
            background: linear-gradient(135deg, #34d399, #10b981);
        }
        .btn-request-booster.disabled {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .top-boosters-footer {
            text-align: center; font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            font-style: italic;
        }
        .top-boosters-footer i { color: #ff4655; margin-right: 6px; }
        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        @keyframes slideDown {
            from { transform: translate(-50%, 0); opacity: 1; }
            to { transform: translate(-50%, 100px); opacity: 0; }
        }
        @media (max-width: 768px) {
            .top-boosters-grid { grid-template-columns: 1fr; }
            .top-boosters-title { font-size: 18px; }
        }
